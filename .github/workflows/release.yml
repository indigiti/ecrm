name: eCRM Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecrm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find app public tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python -m py_compile workers/geocode.py
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: php tests/phase2-smoke.php
      - run: php tests/phase2-integrity.php
      - run: npm install
      - run: npm run build
      - run: php tools/package-release.php
      - uses: actions/upload-artifact@v4
        with:
          name: ecrm-release
          path: release/
          if-no-files-found: error
